dding:12px 10px;font:13px var(--mono);caret-color:var(--accent)}input::placeholder{color:#555963}.run{border:0;border-left:1px solid #26272c;background:#f2f2f3;color:#111216;padding:0 18px;font-weight:700}.ref{margin-top:12px;overflow:hidden}.ref summary{padding:11px 12px;cursor:pointer;list-style:none;display:flex;gap:8px;align-items:center;font-size:11.5px;color:#c6c8ce}.ref summary:before{content:"⌘";font:12px var(--mono);color:#777b85}.ref summary:after{content:"＋";margin-left:auto;color:#6d717b}.ref[open] summary:after{content:"−"}.refbody{border-top:1px solid #ffffff0a;padding:11px 12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 12px}.cmd{display:grid;grid-template-columns:54px 1fr;gap:8px;font-size:11px;color:#8e929c}.cmd code{color:#e4e5e8;font:600 11px var(--mono)}button:disabled{opacity:.3}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid #ff6b78;outline-offset:2px}.muted{color:#777b85}.ok{color:var(--green)}.danger{color:var(--red)}code{font-family:var(--mono)}

</style></head><body><div class="app"><header class="head"><div class="brand"><div class="mark">&gt;_</div><div class="title">コマンドライン初心者シミュレータ</div></div><div class="ver">v8</div></header><div class="intro"><span class="dot"></span><span><b>安全な仮想環境</b> — 本物のPCには触れません。進捗はこのブラウザに自動保存されます。</span></div><main class="workspace"><section class="panel lesson"><div class="top"><div><div class="eyebrow">Lesson</div><div class="ltitle" id="lessonTitle"></div></div><div class="progress" id="progress"></div></div><div class="track" id="progressTrack" role="progressbar" aria-valuemin="0" aria-valuemax="19" aria-valuenow="0"><div class="barprog" id="progressBar"></div></div><div class="label">ポイント</div><div class="explain" id="explain"></div><div class="label">今やること</div><div class="hint" id="hint"></div><div class="chips" id="chips"></div><div class="actions"><button id="retryStep">このステップをやり直す</button><button class="restart" id="restartCourse">最初からやり直す</button></div></section><section><div class="terminal"><div class="tbar"><div class="tlabel"><span class="dots"><i></i><i></i><i></i></span>練習用ターミナル <span class="safe">/ safe shell</span></div><div class="tools"><button id="completeInput">Tab補完</button><button id="historyPrev" disabled>↑ 履歴</button><button id="historyNext" disabled>↓ 履歴</button></div></div><div class="screen" id="screen" role="log"></div><div class="inputrow"><div class="prompt">$</div><input id="input" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="コマンドを入力"><button class="run" id="run">実行</button></div></div><details class="panel ref"><summary>使えるコマンド</summary><div class="refbody"><div class="grid" id="commandGrid"></div></div></details></section></main></div>
<script>
(()=>{const K='command-line-beginner-simulator-progress',C=['pwd','ls','cd','mkdir','touch','cat','echo','cp','mv','rm','grep','clear','help'],L=[
['今いる場所を知る','pwd は今いるフォルダを表示します。','pwd',['pwd'],c=>c==='pwd'],['中身を見る','ls は今いるフォルダの中身を一覧表示します。','ls',['ls'],c=>c==='ls'],['フォルダを作る','mkdir はフォルダを作ります。','mkdir projects',['mkdir projects'],c=>c==='mkdir projects'],['フォルダへ移動する','cd はフォルダを移動します。','cd projects',['cd projects','pwd'],c=>c==='cd projects'],['ファイルを作る','touch は空のファイルを作ります。','touch note.txt',['touch note.txt','ls'],c=>c==='touch note.txt'],['ファイルへ文字を書く','echo の出力は > でファイルへ保存できます。','echo こんにちは > note.txt',['echo こんにちは > note.txt'],c=>/^echo\s+こんにちは\s*>\s*note\.txt$/.test(c)],['ファイルを読む','cat はファイルの中身を表示します。','cat note.txt',['cat note.txt'],c=>c==='cat note.txt'],['コピーする','cp はファイルを複製します。','cp note.txt backup.txt',['cp note.txt backup.txt','ls'],c=>c==='cp note.txt backup.txt'],['名前を変える','mv は移動・名前変更に使います。','mv backup.txt memo.txt',['mv backup.txt memo.txt','ls'],c=>c==='mv backup.txt memo.txt'],['削除する','rm はファイルを削除します。実機では注意が必要です。','rm memo.txt',['rm memo.txt','ls'],c=>c==='rm memo.txt'],['ひとつ上へ戻る','.. はひとつ上のフォルダです。','cd ..',['cd ..','pwd'],c=>c==='cd ..'],['隠しファイルを見る','-a は隠しファイルも表示するオプションです。','ls -a',['ls -a'],c=>c==='ls -a'],['パスを理解する','/ から始まるのが絶対パス、現在地基準が相対パス、~ はホームです。','cd /home/user/projects',['cd /home/user/projects','pwd'],c=>c==='cd /home/user/projects'],['ヘルプで調べる','多くのコマンドは --help で使い方を確認できます。','ls --help',['ls --help'],c=>c==='ls --help'],['スペースを含む名前','スペースを含む名前は引用符で囲みます。','touch "my notes.txt"',['touch "my notes.txt"','ls'],c=>/^touch\s+(["'])my notes\.txt\1$/.test(c)],['追記する','> は上書き、>> は末尾への追記です。','echo 追加メモ >> note.txt',['echo 追加メモ >> note.txt','cat note.txt'],c=>/^echo\s+追加メモ\s*>>\s*note\.txt$/.test(c)],['文字を探す','grep は指定した文字を含む行を探します。','grep 追加 note.txt',['grep 追加 note.txt'],c=>c==='grep 追加 note.txt'],['コマンドをつなぐ','| は左の出力を右のコマンドへ渡します。','cat note.txt | grep こんにちは',['cat note.txt | grep こんにちは'],c=>/^cat\s+note\.txt\s*\|\s*grep\s+こんにちは$/.test(c)],['総合演習','最後は入力候補なしで基本操作を組み合わせます。','projects の中に practice を作って移動し、result.txt に「できた」と保存。cat result.txt で確認してください。',[],c=>c==='cat result.txt'&&cwd()==='/home/user/projects/practice'&&node(['home','user','projects','practice'])?.children?.['result.txt']?.content==='できた']];
const desc={pwd:'今いる場所',ls:'中身を見る',cd:'移動',mkdir:'フォルダ作成',touch:'ファイル作成',cat:'中身表示',echo:'文字を出す・書く',cp:'コピー',mv:'移動・名前変更',rm:'削除',grep:'文字検索',clear:'画面を消す',help:'ヘルプ'};commandGrid.innerHTML=C.map(x=>`<div class="cmd"><code>${x}</code><span>${desc[x]}</span></div>`).join('');
const mk=()=>({type:'dir',children:{home:{type:'dir',children:{user:{type:'dir',children:{welcome:{type:'file',content:'コマンドライン練習へようこそ！'},'.profile':{type:'file',content:'これは隠し設定ファイルの例です'}}}}}}});let fs=mk(),path=['home','user'],lesson=0,snap=null,h=[],hi=0;const $=id=>document.getElementById(id),screen=$('screen'),input=$('input'),hp=$('historyPrev'),hn=$('historyNext');
const node=p=>{let n=fs;for(const s of p){if(!n.children?.[s])return null;n=n.children[s]}return n},cwd=()=>'/'+path.join('/'),parts=(t,b=path)=>{t=String(t??'');let p;t==='~'?(p=['home','user'],t=''):t.startsWith('~/')?(p=['home','user'],t=t.slice(2)):t.startsWith('/')?(p=[],t=t.slice(1)):p=[...b];for(const s of t.split('/'))if(s&&s!=='.')s==='..'?p.pop():p.push(s);return p},entry=t=>node(parts(t)),info=t=>{let p=parts(t);return{p,n:p.at(-1),par:node(p.slice(0,-1)),v:node(p)}},split=s=>s.match(/"[^"]*"|'[^']*'|\S+/g)?.map(x=>x.replace(/^['"]|['"]$/g,''))||[],write=(s,c='')=>{let d=document.createElement('div');d.textContent=s;d.className=c;screen.append(d);screen.scrollTop=screen.scrollHeight};
function save(){try{localStorage.setItem(K,JSON.stringify({lesson,fs,path,snap}))}catch{}}function load(){try{let x=JSON.parse(localStorage.getItem(K));if(x&&Number.isInteger(x.lesson)){lesson=x.lesson;fs=x.fs;path=x.path;snap=x.snap;return 1}}catch{}return 0}function state(){return{fs:JSON.parse(JSON.stringify(fs)),path:[...path]}}function restore(s){fs=JSON.parse(JSON.stringify(s.fs));path=[...s.path]}
function exec(raw,stdin=null){let a=split(raw),n=a[0],o=[],say=(t,c='')=>o.push([t,c]);if(a[1]==='--help'){say(`${n}: このコマンドの使い方を確認できます`);return o}if(n==='pwd')say(cwd());else if(n==='ls'){let all=a.includes('-a'),v=entry(a.find((x,i)=>i&& !x.startsWith('-'))||'.');if(!v)say('ls: その場所はありません','danger');else{let z=Object.keys(v.children||{}).filter(x=>all||!x.startsWith('.'));if(all)z=['.','..',...z];say(z.join('  ')||'(空です)')}}else if(n==='cd'){let p=parts(a[1]??'~'),v=node(p);v?.type==='dir'?path=p:say('cd: そのフォルダはありません','danger')}else if(n==='mkdir'||n==='touch'){if(!a[1])say(`${n}: 名前が必要です`,'danger');else{let t=info(a[1]);if(!t.par)say(`${n}: 親フォルダがありません`,'danger');else if(t.v)say(`${n}: すでに存在します`,'danger');else t.par.children[t.n]=n==='mkdir'?{type:'dir',children:{}}:{type:'file',content:''}}}else if(n==='cat'){let v=entry(a[1]);v?.type==='file'?say(v.content):say('cat: そのファイルはありません','danger')}else if(n==='echo')say(a.slice(1).join(' '));else if(n==='cp'||n==='mv'){let s=info(a[1]),d=info(a[2]);if(!s.v||!d.par)say(`${n}: 元または先を確認してください`,'danger');else{d.par.children[d.n]=n==='cp'?JSON.parse(JSON.stringify(s.v)):s.v;if(n==='mv')delete s.par.children[s.n]}}else if(n==='rm'){let t=info(a[1]);t.v?.type==='file'?delete t.par.children[t.n]:say('rm: ファイルが見つかりません','danger')}else if(n==='grep'){let src=a[2]?entry(a[2])?.content:stdin;if(src==null)say('grep: 入力を確認してください','danger');else say(String(src).split('\n').filter(x=>x.includes(a[1]||'')).join('\n'))}else if(n==='clear')screen.innerHTML='';else if(n==='help')say(C.join(' ')+'\n↑↓で履歴、Tabで補完できます。');else say(`${n}: コマンドが見つかりません。help を試してください。`,'danger');return o}
function finish(c,ok){if(ok&&lesson<L.length&&L[lesson][4](c)){write('✓ このステップはクリアです','ok');lesson++;snap=state();render();if(lesson===L.length)write('19ステップ完了！','ok')}save()}function run(raw){let c=raw.trim();if(!c)return;h.at(-1)!==c&&h.push(c);hi=h.length;hist();write('$ '+c);let m=c.match(/^echo\s+(.+?)\s*(>>|>)\s*(.+)$/);if(m){let t=info(split(m[3])[0]),v=m[1].replace(/^(["'])(.*)\1$/,'$2'),ok=!!t.par;if(ok)t.par.children[t.n]={type:'file',content:m[2]==='>>'&&t.v?.type==='file'?t.v.content+(t.v.content?'\n':'')+v:v};else write('echo: 保存先を確認してください','danger');finish(c,ok);return}let ps=c.split('|').map(x=>x.trim()),stdin=null,out=[],ok=1;for(let p of ps){out=exec(p,stdin);if(out.some(x=>x[1]==='danger')){ok=0;break}stdin=out.map(x=>x[0]).join('\n')}out.forEach(x=>write(x[0],x[1]));finish(c,ok)}
function render(){let l=L[lesson],r=$('retryStep');$('progressTrack').setAttribute('aria-valuemax',L.length);if(!l){$('lessonTitle').textContent='基本編クリア';$('progress').textContent='19 / 19';$('progressBar').style.width='100%';$('explain').textContent='基本操作を組み合わせる流れまで理解できました。';$('hint').textContent='自由に仮想環境を試せます。';$('chips').innerHTML='';r.hidden=1;return}r.hidden=0;$('lessonTitle').textContent=`${lesson+1}. ${l[0]}`;$('progress').textContent=`${lesson+1} / ${L.length}`;$('progressBar').style.width=`${lesson/L.length*100}%`;$('explain').textContent=l[1];$('hint').textContent=l[2];$('chips').innerHTML='';l[3].forEach(c=>{let b=document.createElement('button');b.textContent=c;b.onclick=()=>{input.value=c;input.focus()};$('chips').append(b)})}
function hist(){hp.disabled=!h.length||hi<=0;hn.disabled=!h.length||hi>=h.length}function go(d){if(!h.length)return;hi=Math.max(0,Math.min(h.length,hi+d));input.value=hi===h.length?'':h[hi];hist();input.focus()}function tab(){let q=input.value.trim(),a=split(q);if(a.length<=1&&!q.endsWith(' ')){let z=C.filter(x=>x.startsWith(a[0]||''));if(z.length===1)input.value=z[0];else if(z.length>1)write(z.join('  '),'muted');return}let t=a.at(-1)||'',p=parts(t.includes('/')?t.slice(0,t.lastIndexOf('/')+1):'.'),v=node(p);if(!v)return;let frag=t.includes('/')?t.slice(t.lastIndexOf('/')+1):t,z=Object.keys(v.children||{}).filter(x=>x.startsWith(frag));if(z.length===1)input.value=q.slice(0,q.length-frag.length)+z[0];else if(z.length>1)write(z.join('  '),'muted')}
$('run').onclick=()=>{run(input.value);input.value='';input.focus()};input.onkeydown=e=>{if(e.isComposing)return;if(e.key==='Enter'){run(input.value);input.value=''}else if(e.key==='ArrowUp'){e.preventDefault();go(-1)}else if(e.key==='ArrowDown'){e.preventDefault();go(1)}else if(e.key==='Tab'){e.preventDefault();tab()}};$('completeInput').onclick=tab;hp.onclick=()=>go(-1);hn.onclick=()=>go(1);$('retryStep').onclick=()=>{if(snap){restore(snap);screen.innerHTML='';write(`ステップ ${lesson+1} の開始状態に戻しました。`,'muted');save();render()}};$('restartCourse').onclick=()=>{if(confirm('最初からやり直しますか？')){fs=mk();path=['home','user'];lesson=0;snap=state();h=[];hi=0;localStorage.removeItem(K);screen.innerHTML='';render();save()}};let resumed=load();snap||=state();write(resumed?`保存されていたステップ ${Math.min(lesson+1,L.length)} から再開します。`:'安全な練習用ターミナルです。最初の課題を実行してください。');render();hist();save()})();
</script></body></html>
