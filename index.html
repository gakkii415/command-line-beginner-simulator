<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="実際のファイルを変更せず、ブラウザでコマンドラインの基本を練習できる初心者向けシミュレータです。"
    />
    <meta name="theme-color" content="#08090b" />
    <title>コマンドライン初心者シミュレータ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=Noto+Sans+JP:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand" aria-label="コマンドライン初心者シミュレータ">
          <div class="brand-mark" aria-hidden="true"><span>&gt;</span><i>_</i></div>
          <div class="brand-copy">
            <span class="brand-name">Command Line</span>
            <span class="brand-description">初心者シミュレータ</span>
          </div>
        </div>

        <div class="topbar-status">
          <div class="environment-status">
            <span class="status-light" aria-hidden="true"></span>
            <span>安全な仮想環境</span>
          </div>
          <span class="lesson-count">19 lessons</span>
        </div>
      </header>

      <main class="workspace">
        <aside class="lesson-pane" aria-labelledby="lessonTitle">
          <div class="lesson-path-row">
            <span class="section-kicker">学習パス</span>
            <code id="lessonPath">~/learn/01-pwd</code>
          </div>

          <div class="lesson-progress-row">
            <div class="step-count">
              <span id="currentStep">01</span><span aria-hidden="true"> / </span><span id="totalSteps">19</span>
            </div>
            <div
              class="progress-track"
              id="progressTrack"
              role="progressbar"
              aria-label="コース進捗"
              aria-valuemin="0"
              aria-valuemax="19"
              aria-valuenow="1"
            >
              <div class="progress-value" id="progressBar"></div>
            </div>
          </div>

          <div class="lesson-rail" id="lessonRail" aria-hidden="true"></div>

          <div class="lesson-content">
            <div class="lesson-heading">
              <span class="section-kicker">現在のレッスン</span>
              <h1 id="lessonTitle"></h1>
            </div>

            <section class="lesson-section" aria-labelledby="pointLabel">
              <h2 class="section-label" id="pointLabel">ポイント</h2>
              <p class="lesson-explanation" id="explain"></p>
            </section>

            <section class="lesson-section" aria-labelledby="taskLabel">
              <h2 class="section-label" id="taskLabel">今やること</h2>
              <div class="task-command">
                <span class="task-prompt" aria-hidden="true">$</span>
                <code id="hint"></code>
              </div>
            </section>

            <div class="suggestions" id="chips" aria-label="入力候補"></div>
          </div>

          <div class="lesson-actions">
            <button class="quiet-button" id="retryStep" type="button">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M3.3 5.2A5.5 5.5 0 1 1 2.7 9M3.3 5.2V1.8M3.3 5.2h3.4" /></svg>
              このレッスンをリセット
            </button>
            <button class="quiet-button is-danger" id="restartCourse" type="button">
              最初からやり直す
            </button>
          </div>
        </aside>

        <section class="console-pane" aria-label="練習用ターミナル">
          <div class="console-titlebar">
            <div class="window-dots" aria-hidden="true"><i></i><i></i><i></i></div>
            <div class="console-identity">
              <span>practice — shell</span>
              <code id="terminalPath">~</code>
            </div>
            <div class="sandbox-badge">
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="M8 1.8 13 4.2v3.6c0 3.1-2 5.4-5 6.4-3-1-5-3.3-5-6.4V4.2L8 1.8Z" /><path d="m5.8 8 1.4 1.4 3-3.1" /></svg>
              <span>Sandbox</span>
            </div>
          </div>

          <div class="terminal-screen" id="screen" role="log" aria-live="polite" aria-label="コマンドの実行結果"></div>

          <form class="command-form" id="commandForm">
            <label class="sr-only" for="input">コマンドを入力</label>
            <div class="live-prompt" aria-hidden="true">
              <span class="prompt-user">guest</span><span class="prompt-separator">:</span><span class="prompt-path" id="promptPath">~</span><span class="prompt-symbol">$</span>
            </div>
            <input
              id="input"
              autocomplete="off"
              autocapitalize="none"
              autocorrect="off"
              spellcheck="false"
              enterkeyhint="go"
              placeholder="コマンドを入力…"
            />
            <button class="run-button" id="run" type="submit">
              <span>実行</span>
              <kbd>Enter</kbd>
            </button>
          </form>

          <div class="console-toolbar" aria-label="入力補助">
            <div class="tool-group">
              <button class="tool-button" id="completeInput" type="button"><kbd>Tab</kbd><span>補完</span></button>
              <button class="tool-button" id="historyPrev" type="button" disabled><kbd>↑</kbd><span>前の履歴</span></button>
              <button class="tool-button" id="historyNext" type="button" disabled><kbd>↓</kbd><span>次の履歴</span></button>
            </div>
            <span class="autosave-note"><i aria-hidden="true"></i>進捗は自動保存</span>
          </div>

          <details class="command-reference">
            <summary>
              <span class="summary-title"><span aria-hidden="true">⌘</span> 使えるコマンド</span>
              <span class="summary-meta">13 commands</span>
              <svg aria-hidden="true" viewBox="0 0 16 16"><path d="m4 6 4 4 4-4" /></svg>
            </summary>
            <div class="command-grid" id="commandGrid"></div>
          </details>
        </section>
      </main>
    </div>

    <noscript>このシミュレータを利用するにはJavaScriptを有効にしてください。</noscript>
    <script src="./app.js" defer></script>
  </body>
</html>
